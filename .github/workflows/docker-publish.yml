name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version_major:
        description: "Major version (e.g. 1)"
        required: true
        default: "1"
      version_minor:
        description: "Minor version (e.g. 0)"
        required: true
        default: "0"
  push:
    tags:
      - "v*.*"

env:
  IMAGE_NAME: amwpfiqvy/proxysql-admin-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          logout: true

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag push: refs/tags/v1.0
            TAG="${GITHUB_REF#refs/tags/v}"
            MAJOR=$(echo "$TAG" | cut -d. -f1)
            MINOR=$(echo "$TAG" | cut -d. -f2)
          else
            MAJOR="${{ inputs.version_major }}"
            MINOR="${{ inputs.version_minor }}"
          fi
          # Auto-suffix: .YYYYMMDD.HHMM (4 segments total)
          STAMP=$(TZ=Asia/Shanghai date +'%Y%m%d.%H%M')
          VERSION="${MAJOR}.${MINOR}.${STAMP}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && steps.docker_build.outcome == 'success'
        run: |
          git tag "v${{ steps.ver.outputs.major_minor }}"-${{ github.run_number }}
          git push origin "v${{ steps.ver.outputs.major_minor }}-${{ github.run_number }}"
